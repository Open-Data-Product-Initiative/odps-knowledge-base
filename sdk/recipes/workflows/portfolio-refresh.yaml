schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-PORTFOLIO-REFRESH-001
    name:
      en: Refresh Example Portfolio
    description:
      en: Refresh the example portfolio workspace from source lane notes through guarded LLM execution.
    tags:
      - portfolio
      - refresh
      - llm
  version: "1.0.0"
  type: dev
  review:
    required: true
  execution:
    providerRef: claude
  steps:
    - id: refresh
      command: portfolio.refresh
      providerRef: claude
      model: claude-sonnet-4-5
      with:
        workspace: workspace/
        objectives:
          - source-lanes/objectives/
        useCases:
          - source-lanes/use-cases/
        signals:
          - source-lanes/signals/
        products:
          - source-lanes/products/
        allSources: true
