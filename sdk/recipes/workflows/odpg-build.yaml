schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-ODPG-BUILD-001
    name:
      en: Build ODPG Graph
    description:
      en: Build an ODPG graph from ODPC fragments through guarded LLM edge inference.
    tags:
      - odpg
      - graph
      - llm
  version: "1.0.0"
  type: dev
  review:
    required: true
  execution:
    providerRef: claude
  steps:
    - id: build-graph
      command: odpg.build
      providerRef: claude
      model: claude-sonnet-4-5
      with:
        input: graph-fragments/
        output: workspace/odpg/graph.yaml
        toon: workspace/odpg/graph.toon
        gcf: workspace/odpg/graph.gcf
        id: recipe-example-graph
        name: Recipe Example Graph
