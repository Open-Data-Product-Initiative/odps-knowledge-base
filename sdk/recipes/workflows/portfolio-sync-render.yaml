schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-PORTFOLIO-SYNC-001
    name:
      en: Sync and Render Example Portfolio
    description:
      en: Synchronize edited portfolio YAML, render HTML, and summarize the workspace without calling an LLM.
    tags:
      - portfolio
      - deterministic
  version: "1.0.0"
  type: ci
  steps:
    - id: sync
      command: portfolio.sync
      with:
        workspace: workspace/
    - id: render
      command: portfolio.render
      with:
        workspace: workspace/
    - id: explain
      command: portfolio.explain
      with:
        workspace: workspace/
