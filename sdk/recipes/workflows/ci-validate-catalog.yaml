schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-CI-VALIDATE-001
    name:
      en: Validate Example Catalog
    description:
      en: Validate the example ODPC catalog without calling an LLM.
    tags:
      - ci
      - validation
  version: "1.0.0"
  type: ci
  steps:
    - id: validate-catalog
      command: validate
      with:
        document: workspace/odpc/catalog.yaml
