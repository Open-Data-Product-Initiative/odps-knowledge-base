schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-GENERATE-SIGNAL-001
    name:
      en: Generate Signal Fragment
    description:
      en: Generate an ODPC signal fragment from source lane notes through guarded LLM execution.
    tags:
      - odpc
      - signal
      - generation
      - llm
  version: "1.0.0"
  type: dev
  review:
    required: true
  execution:
    providerRef: claude
  steps:
    - id: generate-signal
      command: generate
      providerRef: claude
      model: claude-sonnet-4-5
      with:
        input: source-lanes/signals/
        kind: signal
        output: workspace/generated-fragments/
